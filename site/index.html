<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/ricewater-sentinel/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="水稻田水位監控、藍牙下載與雲端歷史資訊系統">
  <meta name="theme-color" content="#0d6048">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="水稻田監控">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>水稻田監控系統</title>
  <link rel="manifest" href="manifest.json">
  <!-- Beacio 在 iOS Safari 中提供 Web Bluetooth 相容介面。 -->
  <script defer src="https://beacio.com/beacio.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      const hadServiceWorkerController = navigator.serviceWorker.controller !== null;
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        // A first-time install already has the newest page and should not flash
        // through an unnecessary reload. Existing PWA clients reload once.
        if (!hadServiceWorkerController || reloading) return;
        reloading = true;
        location.reload();
      });
      addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then((registration) => registration.update())
          .catch((error) => console.warn('PWA 更新服務啟動失敗', error));
      });
    }
  </script>
</body>
</html>
